# Prometheus config of scripts/test-integrations.sh: scrapes the three
# exporter recipes, each under its own job.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: postgres_exporter
    static_configs:
      - targets: ["pe:9187"]
  - job_name: sql_exporter
    static_configs:
      - targets: ["se:9399"]
  - job_name: otelcol
    static_configs:
      - targets: ["otel:8889"]
