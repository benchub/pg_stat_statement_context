# OpenTelemetry Collector (contrib distribution, otelcol-contrib, tested with
# 0.162.0) configuration for pg_stat_statement_context.
#
# The core `postgresql` receiver collects a fixed set of server metrics and
# cannot run arbitrary queries, so it cannot read this extension. The
# contrib `sql_query` receiver (formerly `sqlquery`, stability: alpha) runs
# SQL and maps columns to metrics and attributes; it is used here. It is
# only in otelcol-contrib (or a custom build that includes it), not in the
# core distribution.
#
# The metric names and attributes match ../postgres_exporter/queries.yaml and
# ../sql_exporter/, so the Prometheus exporter below produces the series the
# Grafana dashboard expects. See ../README.md for the semantics:
# * *_per_second are gauges: the average over the last CLOSED bucket (from
#   the pg_stat_statement_context_last_bucket view). Do not convert them to
#   rates, or treat them as sums.
# * pssc_info_* counters are cumulative monotonic sums whose start time is
#   _counters().stats_reset (start_ts_column, in Unix nanoseconds), so a reset
#   is a proper counter restart for OTLP and Prometheus consumers.
# * Tags become tag_<key> attributes; edit the tag_* columns and
#   attribute_columns to match your pg_stat_statement_context.tags allowlist.
#
# Connection settings come from the environment:
#   PSSC_PG_HOST, PSSC_PG_PORT, PSSC_PG_DATABASE, PSSC_PG_USER, PSSC_PG_PASSWORD
# The role needs pg_read_all_stats (see ../monitoring-role.sql), and the
# extension must exist in PSSC_PG_DATABASE.
receivers:
  sql_query/pssc:
    driver: postgres
    host: ${env:PSSC_PG_HOST}
    port: ${env:PSSC_PG_PORT}
    database: ${env:PSSC_PG_DATABASE}
    username: ${env:PSSC_PG_USER}
    password: ${env:PSSC_PG_PASSWORD}
    additional_params:
      sslmode: disable          # use verify-full in production
    # The gauges only change once per bucket_interval (5 min by default);
    # a shorter interval than that only adds freshness, not resolution.
    collection_interval: 30s
    timeout: 10s
    max_open_conn: 1
    queries:
      # Per tag set: calls and execution time, over all query IDs.
      - sql: |
          WITH i AS (
            SELECT bucket_seconds::float8 AS secs FROM pg_stat_statement_context_counters()
          ), c AS (
            -- The last closed bucket, as chosen by the store: the one before its
            -- current bucket, which never moves backwards, so a backward clock step
            -- can't select an older bucket ...
            SELECT dbid, toplevel, tags, calls, total_exec_time
              FROM pg_stat_statement_context_last_bucket
            UNION ALL
            -- ... and 0 for every live tag set without calls in it.
            SELECT dbid, toplevel, tags, 0, 0
              FROM pg_stat_statement_context_totals
          )
          SELECT coalesce(d.datname, c.dbid::text) AS datname,
                 c.toplevel::text AS toplevel,
                 coalesce(c.tags ->> 'controller', '') AS tag_controller,
                 coalesce(c.tags ->> 'action', '') AS tag_action,
                 coalesce(c.tags ->> 'job', '') AS tag_job,
                 sum(c.calls)::float8 / min(i.secs) AS calls_per_second,
                 sum(c.total_exec_time) / 1000 / min(i.secs) AS exec_seconds_per_second
            FROM c
           CROSS JOIN i
            LEFT JOIN pg_database d ON d.oid = c.dbid
           WHERE c.tags IS NOT NULL
           GROUP BY 1, 2, 3, 4, 5
        metrics:
          - metric_name: pssc_tag_calls_per_second
            description: Completed executions per second, averaged over the last closed bucket.
            value_column: calls_per_second
            value_type: double
            attribute_columns: [datname, toplevel, tag_controller, tag_action, tag_job]
          - metric_name: pssc_tag_exec_seconds_per_second
            description: Execution time in seconds per second over the last closed bucket.
            value_column: exec_seconds_per_second
            value_type: double
            attribute_columns: [datname, toplevel, tag_controller, tag_action, tag_job]

      # Top 5 query IDs per tag set, by execution time in the last closed bucket.
      - sql: |
          WITH i AS (
            SELECT bucket_seconds::float8 AS secs FROM pg_stat_statement_context_counters()
          ), q AS (
            SELECT coalesce(d.datname, c.dbid::text) AS datname,
                   c.toplevel::text AS toplevel,
                   c.queryid::text AS queryid,
                   coalesce(c.tags ->> 'controller', '') AS tag_controller,
                   coalesce(c.tags ->> 'action', '') AS tag_action,
                   coalesce(c.tags ->> 'job', '') AS tag_job,
                   sum(c.calls)::float8 / min(i.secs) AS calls_per_second,
                   sum(c.total_exec_time) / 1000 / min(i.secs) AS exec_seconds_per_second
              FROM pg_stat_statement_context_last_bucket c
             CROSS JOIN i
              LEFT JOIN pg_database d ON d.oid = c.dbid
             WHERE c.tags IS NOT NULL
             GROUP BY 1, 2, 3, 4, 5, 6
          )
          SELECT datname, toplevel, queryid, tag_controller, tag_action, tag_job,
                 calls_per_second, exec_seconds_per_second
            FROM (SELECT q.*, row_number() OVER (
                           PARTITION BY datname, toplevel, tag_controller, tag_action, tag_job
                           ORDER BY exec_seconds_per_second DESC, queryid) AS rank
                    FROM q) r
           WHERE rank <= 5
           ORDER BY exec_seconds_per_second DESC
           LIMIT 500
        metrics:
          - metric_name: pssc_query_calls_per_second
            description: Completed executions per second over the last closed bucket (top 5 query IDs per tag set).
            value_column: calls_per_second
            value_type: double
            attribute_columns: [datname, toplevel, queryid, tag_controller, tag_action, tag_job]
          - metric_name: pssc_query_exec_seconds_per_second
            description: Execution time in seconds per second over the last closed bucket (top 5 query IDs per tag set).
            value_column: exec_seconds_per_second
            value_type: double
            attribute_columns: [datname, toplevel, queryid, tag_controller, tag_action, tag_job]

      # Store health: pg_stat_statement_context_counters(), plus one scan of
      # the store for live_entries and oldest_bucket_age_seconds.
      - sql: |
          SELECT i.entries, i.max_entries, l.live_entries,
                 i.buckets, i.bucket_seconds,
                 coalesce(extract(epoch FROM now() - l.oldest_bucket), 0)::float8 AS oldest_bucket_age_seconds,
                 extract(epoch FROM i.last_closed_bucket_start)::float8 AS last_closed_bucket_timestamp_seconds,
                 i.shmem_bytes, i.stats_reset_epoch,
                 (extract(epoch FROM i.stats_reset) * 1e9)::bigint AS stats_reset_unix_nano,
                 i.dealloc, i.reclaimed_entries, i.evicted_entries, i.dropped_records,
                 i.invalid_tags, i.dropped_tags,
                 i.heuristic_scans, i.regex_compile_failures, i.utility_missing_queryid,
                 i.capped_tags, i.cap_table_full, i.exemplar_values_dropped
            FROM pg_stat_statement_context_counters() i
           CROSS JOIN (
                 -- The one scan of the store: entries with a live bucket, and the
                 -- oldest live bucket (a merged row starts at its entry's oldest
                 -- live bucket, so this is _info().oldest_bucket, without a
                 -- second scan). Everything else is read by _counters(), which
                 -- doesn't scan.
                 SELECT count(*) AS live_entries, min(bucket_start) AS oldest_bucket
                   FROM pg_stat_statement_context(false, true)) l
        metrics:
          - {metric_name: pssc_info_entries, value_column: entries, description: "Allocated entries, including dead ones not yet reclaimed"}
          - {metric_name: pssc_info_max_entries, value_column: max_entries, description: "The max_entries setting"}
          - {metric_name: pssc_info_live_entries, value_column: live_entries, description: "Entries with at least one live bucket"}
          - {metric_name: pssc_info_buckets, value_column: buckets, description: "The bucket_count setting"}
          - {metric_name: pssc_info_bucket_interval_seconds, value_column: bucket_seconds, description: "The bucket_interval setting, in seconds"}
          - {metric_name: pssc_info_oldest_bucket_age_seconds, value_column: oldest_bucket_age_seconds, value_type: double, description: "Age of the oldest live bucket (0 if none)"}
          - {metric_name: pssc_info_last_closed_bucket_timestamp_seconds, value_column: last_closed_bucket_timestamp_seconds, value_type: double, description: "Start of the last closed bucket, which the per_second metrics come from, Unix seconds"}
          - {metric_name: pssc_info_shmem_bytes, value_column: shmem_bytes, description: "Shared memory requested at startup"}
          - {metric_name: pssc_info_stats_reset_timestamp_seconds, value_column: stats_reset_epoch, description: "Time of the last reset or server start, Unix seconds"}
          # Counters: cumulative monotonic sums starting at stats_reset. The
          # Prometheus exporter adds the _total suffix.
          - {metric_name: pssc_info_dealloc, value_column: dealloc, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Eviction passes"}
          - {metric_name: pssc_info_reclaimed_entries, value_column: reclaimed_entries, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Dead (expired) entries reclaimed by eviction passes: normal housekeeping"}
          - {metric_name: pssc_info_evicted_entries, value_column: evicted_entries, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Live entries evicted by eviction passes: max_entries is too small"}
          - {metric_name: pssc_info_dropped_records, value_column: dropped_records, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Calls not recorded because an eviction pass freed nothing"}
          - {metric_name: pssc_info_invalid_tags, value_column: invalid_tags, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Tags rejected as malformed"}
          - {metric_name: pssc_info_dropped_tags, value_column: dropped_tags, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Valid tags dropped by max_tags / max_tagset_bytes"}
          - {metric_name: pssc_info_heuristic_scans, value_column: heuristic_scans, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Statements whose comments were found by the heuristic tail scan"}
          - {metric_name: pssc_info_regex_compile_failures, value_column: regex_compile_failures, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Regex extractors that failed to compile in a backend"}
          - {metric_name: pssc_info_utility_missing_queryid, value_column: utility_missing_queryid, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Tracked utility statements without a query ID"}
          - {metric_name: pssc_info_capped_tags, value_column: capped_tags, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Tag values collapsed to null by a cardinality cap"}
          - {metric_name: pssc_info_cap_table_full, value_column: cap_table_full, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Of capped_tags, the values collapsed because the cap table was full (raise cardinality_cap_slots)"}
          - {metric_name: pssc_info_exemplar_values_dropped, value_column: exemplar_values_dropped, data_type: sum, monotonic: true, start_ts_column: stats_reset_unix_nano, description: "Exemplar values dropped as longer than exemplar_value_bytes"}

processors:
  batch: {}

exporters:
  # Prometheus scrape endpoint. Series not refreshed for metric_expiration
  # disappear: keep it a little above collection_interval, so that top-N
  # query IDs that drop out of the top 5 are not reported for minutes.
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 90s
  # To push instead, replace prometheus with e.g.:
  # otlphttp:
  #   endpoint: https://otlp.example.com
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [sql_query/pssc]
      processors: [batch]
      exporters: [prometheus, debug]
