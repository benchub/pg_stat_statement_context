# sql_exporter collector for pg_stat_statement_context: the same metrics,
# names and labels as ../postgres_exporter/queries.yaml, so the Grafana
# dashboard works with either. See ../README.md for the semantics:
#
# * *_per_second metrics are gauges (average over the last CLOSED bucket):
#   never rate() them. While the system clock is behind the store's current
#   bucket (after a backward step) the queries return no rows.
# * pssc_info_*_total are counters (reset by pg_stat_statement_context_reset()
#   or a restart): rate()/increase() them.
# * Tags are exported as tag_<key> labels; edit the tag_* columns (and
#   key_labels) to match your pg_stat_statement_context.tags allowlist.
# * Sum only toplevel="true" for per-context totals.
collector_name: pg_stat_statement_context

queries:
  - query_name: pssc_tag
    query: |
      WITH c AS MATERIALIZED (
        SELECT * FROM pg_stat_statement_context
      ), s AS (
        SELECT width, date_bin(width, now(), timestamptz '2000-01-01 00:00:00+00') AS clock_bucket,
               (SELECT max(bucket_start) FROM c) AS newest
          FROM (SELECT current_setting('pg_stat_statement_context.bucket_interval')::interval AS width) g
      ), w AS (
        -- The last closed bucket is the one before the store's current bucket.
        -- That never moves backwards, and the newest bucket with data is a lower
        -- bound for it, so a clock step back can't select an older bucket. If
        -- the newest bucket is more than one bucket ahead of now(), the clock
        -- was stepped back: no bucket closes until it catches up, so no rows.
        SELECT greatest(clock_bucket, newest) - width AS closed,
               extract(epoch FROM width)::float8 AS secs
          FROM s
         WHERE newest IS NULL OR newest <= clock_bucket + width
      )
      SELECT coalesce(d.datname, c.dbid::text) AS datname,
             c.toplevel::text AS toplevel,
             coalesce(c.tags ->> 'controller', '') AS tag_controller,
             coalesce(c.tags ->> 'action', '') AS tag_action,
             coalesce(c.tags ->> 'job', '') AS tag_job,
             coalesce(sum(c.calls) FILTER (WHERE c.bucket_start = w.closed), 0)::float8
               / min(w.secs) AS calls_per_second,
             coalesce(sum(c.total_exec_time) FILTER (WHERE c.bucket_start = w.closed), 0)
               / 1000 / min(w.secs) AS exec_seconds_per_second
        FROM c
       CROSS JOIN w
        LEFT JOIN pg_database d ON d.oid = c.dbid
       WHERE c.tags IS NOT NULL
       GROUP BY 1, 2, 3, 4, 5

  - query_name: pssc_query
    query: |
      WITH c AS MATERIALIZED (
        SELECT * FROM pg_stat_statement_context
      ), s AS (
        SELECT width, date_bin(width, now(), timestamptz '2000-01-01 00:00:00+00') AS clock_bucket,
               (SELECT max(bucket_start) FROM c) AS newest
          FROM (SELECT current_setting('pg_stat_statement_context.bucket_interval')::interval AS width) g
      ), w AS (
        -- The last closed bucket is the one before the store's current bucket.
        -- That never moves backwards, and the newest bucket with data is a lower
        -- bound for it, so a clock step back can't select an older bucket. If
        -- the newest bucket is more than one bucket ahead of now(), the clock
        -- was stepped back: no bucket closes until it catches up, so no rows.
        SELECT greatest(clock_bucket, newest) - width AS closed,
               extract(epoch FROM width)::float8 AS secs
          FROM s
         WHERE newest IS NULL OR newest <= clock_bucket + width
      ), q AS (
        SELECT coalesce(d.datname, c.dbid::text) AS datname,
               c.toplevel::text AS toplevel,
               c.queryid::text AS queryid,
               coalesce(c.tags ->> 'controller', '') AS tag_controller,
               coalesce(c.tags ->> 'action', '') AS tag_action,
               coalesce(c.tags ->> 'job', '') AS tag_job,
               sum(c.calls)::float8 / min(w.secs) AS calls_per_second,
               sum(c.total_exec_time) / 1000 / min(w.secs) AS exec_seconds_per_second
          FROM c
          JOIN w ON c.bucket_start = w.closed
          LEFT JOIN pg_database d ON d.oid = c.dbid
         WHERE c.tags IS NOT NULL
         GROUP BY 1, 2, 3, 4, 5, 6
      )
      SELECT datname, toplevel, queryid, tag_controller, tag_action, tag_job,
             calls_per_second, exec_seconds_per_second
        FROM (SELECT q.*, row_number() OVER (
                       PARTITION BY datname, toplevel, tag_controller, tag_action, tag_job
                       ORDER BY exec_seconds_per_second DESC, queryid) AS rank
                FROM q) r
       WHERE rank <= 5
       ORDER BY exec_seconds_per_second DESC
       LIMIT 500

  - query_name: pssc_info
    query: |
      SELECT i.entries::float8 AS entries,
             i.max_entries::float8 AS max_entries,
             (SELECT count(*) FROM pg_stat_statement_context(false, true))::float8 AS live_entries,
             i.buckets::float8 AS buckets,
             extract(epoch FROM current_setting('pg_stat_statement_context.bucket_interval')::interval)::float8
               AS bucket_interval_seconds,
             coalesce(extract(epoch FROM now() - i.oldest_bucket), 0)::float8 AS oldest_bucket_age_seconds,
             i.shmem_bytes::float8 AS shmem_bytes,
             extract(epoch FROM i.stats_reset)::float8 AS stats_reset_timestamp_seconds,
             i.dealloc::float8 AS dealloc_total,
             i.evicted_entries::float8 AS evicted_entries_total,
             i.invalid_tags::float8 AS invalid_tags_total,
             i.dropped_tags::float8 AS dropped_tags_total,
             i.heuristic_scans::float8 AS heuristic_scans_total,
             i.regex_compile_failures::float8 AS regex_compile_failures_total,
             i.utility_missing_queryid::float8 AS utility_missing_queryid_total
        FROM pg_stat_statement_context_info() i

metrics:
  - metric_name: pssc_tag_calls_per_second
    type: gauge
    help: "Completed executions per second, averaged over the last closed bucket. A gauge: do not rate() it."
    key_labels: [datname, toplevel, tag_controller, tag_action, tag_job]
    values: [calls_per_second]
    query_ref: pssc_tag
  - metric_name: pssc_tag_exec_seconds_per_second
    type: gauge
    help: "Execution time in seconds per second over the last closed bucket. A gauge: do not rate() it."
    key_labels: [datname, toplevel, tag_controller, tag_action, tag_job]
    values: [exec_seconds_per_second]
    query_ref: pssc_tag

  - metric_name: pssc_query_calls_per_second
    type: gauge
    help: "Completed executions per second over the last closed bucket (top 5 query IDs per tag set)."
    key_labels: [datname, toplevel, queryid, tag_controller, tag_action, tag_job]
    values: [calls_per_second]
    query_ref: pssc_query
  - metric_name: pssc_query_exec_seconds_per_second
    type: gauge
    help: "Execution time in seconds per second over the last closed bucket (top 5 query IDs per tag set)."
    key_labels: [datname, toplevel, queryid, tag_controller, tag_action, tag_job]
    values: [exec_seconds_per_second]
    query_ref: pssc_query

  - {metric_name: pssc_info_entries, type: gauge, help: "Allocated entries, including dead ones not yet reclaimed", values: [entries], query_ref: pssc_info}
  - {metric_name: pssc_info_max_entries, type: gauge, help: "The max_entries setting", values: [max_entries], query_ref: pssc_info}
  - {metric_name: pssc_info_live_entries, type: gauge, help: "Entries with at least one live bucket", values: [live_entries], query_ref: pssc_info}
  - {metric_name: pssc_info_buckets, type: gauge, help: "The bucket_count setting", values: [buckets], query_ref: pssc_info}
  - {metric_name: pssc_info_bucket_interval_seconds, type: gauge, help: "The bucket_interval setting, in seconds", values: [bucket_interval_seconds], query_ref: pssc_info}
  - {metric_name: pssc_info_oldest_bucket_age_seconds, type: gauge, help: "Age of the oldest live bucket (0 if none)", values: [oldest_bucket_age_seconds], query_ref: pssc_info}
  - {metric_name: pssc_info_shmem_bytes, type: gauge, help: "Shared memory requested at startup", values: [shmem_bytes], query_ref: pssc_info}
  - {metric_name: pssc_info_stats_reset_timestamp_seconds, type: gauge, help: "Time of the last reset or server start, Unix seconds", values: [stats_reset_timestamp_seconds], query_ref: pssc_info}
  - {metric_name: pssc_info_dealloc_total, type: counter, help: "Eviction passes", values: [dealloc_total], query_ref: pssc_info}
  - {metric_name: pssc_info_evicted_entries_total, type: counter, help: "Entries removed by eviction passes, dead or live", values: [evicted_entries_total], query_ref: pssc_info}
  - {metric_name: pssc_info_invalid_tags_total, type: counter, help: "Tags rejected as malformed", values: [invalid_tags_total], query_ref: pssc_info}
  - {metric_name: pssc_info_dropped_tags_total, type: counter, help: "Valid tags dropped by max_tags / max_tagset_bytes", values: [dropped_tags_total], query_ref: pssc_info}
  - {metric_name: pssc_info_heuristic_scans_total, type: counter, help: "Statements whose comments were found by the heuristic tail scan", values: [heuristic_scans_total], query_ref: pssc_info}
  - {metric_name: pssc_info_regex_compile_failures_total, type: counter, help: "Regex extractors that failed to compile in a backend", values: [regex_compile_failures_total], query_ref: pssc_info}
  - {metric_name: pssc_info_utility_missing_queryid_total, type: counter, help: "Tracked utility statements without a query ID (check shared_preload_libraries order)", values: [utility_missing_queryid_total], query_ref: pssc_info}
